name: Build Windows Executable & Installer

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build React frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Install Python desktop & build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt

      - name: Build executable with PyInstaller
        run: pyinstaller --noconfirm --clean MecaSpace.spec

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Windows Installer (MecaSpace_Setup.exe)
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Upload MecaSpace Installer
        uses: actions/upload-artifact@v4
        with:
          name: MecaSpace_Setup_Windows
          path: Output/MecaSpace_Setup.exe

      - name: Upload Portable MecaSpace Bundle
        uses: actions/upload-artifact@v4
        with:
          name: MecaSpace_Portable_Windows
          path: dist/MecaSpace/

